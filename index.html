<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKWA // REMOTE NODE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020402;
            color: #39ff14;
            font-family: "Courier New", monospace;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: radial-gradient(ellipse at center, #081408 0%, #010401 62%, #000 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            background: repeating-linear-gradient(to bottom, rgba(57,255,20,.035) 0 1px, transparent 1px 4px);
            mix-blend-mode: screen;
            animation: scanlines .12s linear infinite;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -10%;
            pointer-events: none;
            z-index: 51;
            background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,.72) 100%);
            animation: crtFlicker .18s infinite;
        }

        @keyframes scanlines {
            from { transform: translateY(0); }
            to { transform: translateY(4px); }
        }

        @keyframes crtFlicker {
            0%,100% { opacity:.82; }
            50% { opacity:.88; }
        }

        @keyframes screenJitter {
            0%,100% { transform:translate(-50%,-50%); }
            25% { transform:translate(calc(-50% + .5px),calc(-50% - .3px)); }
            50% { transform:translate(calc(-50% - .4px),calc(-50% + .4px)); }
            75% { transform:translate(calc(-50% + .3px),calc(-50% + .2px)); }
        }

        /* ================================
           ЭКРАН ЗАПУСКА
           ================================ */

        #startup {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 20px;

            width: 100%;
        }

        #startup-title {
            font-size: 28px;
            letter-spacing: 4px;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57,255,20,.35);
        }

        #startup-subtitle {
            color: #58a94a;
            font-size: 14px;
            letter-spacing: 2px;
        }

        #start-button {
            margin-top: 20px;
            padding: 15px 40px;
            background: rgba(0,0,0,.35);
            border: 1px solid #39ff14;
            color: #39ff14;
            font-family: "Courier New", monospace;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(57,255,20,.08);
        }

        #start-button:hover {
            background: rgba(57,255,20,.12);
            box-shadow: 0 0 20px rgba(57,255,20,.18);
        }

        /* ================================
           ТЕРМИНАЛ
           ================================ */

        #terminal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: min(94vw,1100px);
            height: min(82vh,760px);
            min-height: 400px;
            padding: 34px 42px;
            border: 10px solid #071007;
            border-radius: 24px;
            background: #020702;
            box-shadow: 0 0 0 2px #168516, 0 0 35px rgba(57,255,20,.12), inset 0 0 70px rgba(0,0,0,.95);
            flex-direction: column;
            overflow: hidden;
            animation: screenJitter .16s steps(2,end) infinite;
        }

        #terminal::before {
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            border-radius:14px;
            background: linear-gradient(rgba(255,255,210,.025),rgba(0,0,0,.08)), repeating-linear-gradient(0deg,transparent 0 3px,rgba(57,255,20,.035) 4px);
            box-shadow:inset 0 0 90px rgba(0,0,0,.8);
            z-index:2;
        }

        #terminal::after {
            content:"";
            position:absolute;
            left:0; right:0;
            height:3px;
            top:30%;
            background:rgba(57,255,20,.045);
            box-shadow:0 0 12px rgba(57,255,20,.08);
            pointer-events:none;
            z-index:3;
            animation:beam 5s linear infinite;
        }

        @keyframes beam {
            from {top:-5%;}
            to {top:105%;}
        }

        #output {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            text-align: left;
            padding: 10px 8px 15px;
            color: #39ff14;
            text-shadow: 0 0 5px rgba(57,255,20,.25);
            position: relative;
            z-index: 4;
            padding-bottom: 15px;
        }

        .system { color:#27c91c; }
        .success { color:#55ff33; text-shadow:0 0 8px rgba(57,255,20,.35); }
        .error { color:#ff5c5c; }
        .warning { color:#b6ff3b; }
        .akwa-input { color:#aaa77d; text-shadow:0 0 4px rgba(170,167,125,.18); }
        .command { color:#b8a8c8; text-shadow:0 0 5px rgba(184,168,200,.22); }

        #input-line {
            display: none;

            flex-shrink: 0;

            justify-content: center;
            align-items: center;

            width: 100%;

            margin-top: 15px;
            padding-top: 15px;

            border-top: 1px solid rgba(57,255,20,.16);
            background: rgba(2,3,2,.92);
            position: relative;
            z-index: 5;
        }

        #prompt {
            color: #8fbd72;
            margin-right: 10px;
        }

        #command-input {
            width: 300px;

            background: transparent;

            border: none;
            outline: none;

            color: #d7d2aa;
            caret-color: #d7d2aa;
            text-shadow: 0 0 5px rgba(215,210,170,.28);

            font-family: "Courier New", monospace;
            font-size: 16px;

            text-align: center;
        }
    </style>
</head>


<body>

    <!-- =================================
         ЭКРАН ДО ЗАПУСКА
         ================================= -->

    <div id="startup">

        <div id="startup-title">
            AKWA // REMOTE NODE 17
        </div>

        <div id="startup-subtitle">
            REMOTE COMPUTER TERMINAL
        </div>

        <button id="start-button">
            ЗАПУСТИТЬ ПК
        </button>

    </div>


    <!-- =================================
         ТЕРМИНАЛ
         ================================= -->

    <div id="terminal">

        <div id="output"></div>

        <div id="input-line">

            <span id="prompt">
                AKWA_OS:
            </span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
            >

        </div>

    </div>


    <script>

        const startup = document.getElementById("startup");
        const terminal = document.getElementById("terminal");
        const button = document.getElementById("start-button");

        const output = document.getElementById("output");
        const inputLine = document.getElementById("input-line");
        const input = document.getElementById("command-input");


        /* ================================
           ВЫВОД ТЕКСТА
           ================================ */

        function print(text, className = "") {

            const line = document.createElement("div");

            line.className = className;

            line.textContent = text;

            output.appendChild(line);

            output.scrollTop = output.scrollHeight;
        }


        /* ================================
           ПАУЗА
           ================================ */

        function sleep(ms) {
            return new Promise(resolve => {
                setTimeout(resolve, ms);
            });
        }


        /* ================================
           ЗВУК СТАРОГО ПК / ЭЛТ
           ================================ */

        let audioContext = null;
        let masterGain = null;
        let humOscillator = null;
        let humGain = null;
        let fanSource = null;
        let fanGain = null;
        let keyBuffer = null;
        let powerBuffer = null;

        function createNoiseBuffer(duration = 0.5) {
            const length = Math.floor(audioContext.sampleRate * duration);
            const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        function initAudio() {
            if (audioContext) {
                if (audioContext.state === "suspended") audioContext.resume();
                return;
            }

            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.32;
            masterGain.connect(audioContext.destination);

            // Низкое постоянное гудение старого блока питания / трансформатора.
            humOscillator = audioContext.createOscillator();
            humGain = audioContext.createGain();
            humOscillator.type = "sine";
            humOscillator.frequency.value = 58;
            humGain.gain.value = 0.028;
            humOscillator.connect(humGain);
            humGain.connect(masterGain);
            humOscillator.start();

            // Вторичная гармоника делает гудение менее синтетическим.
            const hum2 = audioContext.createOscillator();
            const hum2Gain = audioContext.createGain();
            hum2.type = "sine";
            hum2.frequency.value = 116;
            hum2Gain.gain.value = 0.008;
            hum2.connect(hum2Gain);
            hum2Gain.connect(masterGain);
            hum2.start();

            // Тихий шум вентилятора / электроники.
            const fan = audioContext.createBufferSource();
            fan.buffer = createNoiseBuffer(1);
            fan.loop = true;
            const filter = audioContext.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 850;
            fanGain = audioContext.createGain();
            fanGain.gain.value = 0.018;
            fan.connect(filter);
            filter.connect(fanGain);
            fanGain.connect(masterGain);
            fan.start();
            fanSource = fan;

            keyBuffer = createNoiseBuffer(0.08);
            powerBuffer = createNoiseBuffer(0.35);
        }

        function keySound() {
            if (!audioContext || !keyBuffer) return;

            const source = audioContext.createBufferSource();
            const filter = audioContext.createBiquadFilter();
            const gain = audioContext.createGain();
            source.buffer = keyBuffer;
            filter.type = "bandpass";
            filter.frequency.value = 1700 + Math.random() * 900;
            filter.Q.value = 0.7;
            gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.07, audioContext.currentTime + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.045);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            source.start();
            source.stop(audioContext.currentTime + 0.05);
        }

        function powerOnSound() {
            if (!audioContext || !powerBuffer) return;

            const source = audioContext.createBufferSource();
            const filter = audioContext.createBiquadFilter();
            const gain = audioContext.createGain();
            source.buffer = powerBuffer;
            filter.type = "lowpass";
            filter.frequency.value = 900;
            gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.16, audioContext.currentTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.7);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            source.start();
            source.stop(audioContext.currentTime + 0.75);

            const bootOsc = audioContext.createOscillator();
            const bootGain = audioContext.createGain();
            bootOsc.type = "sawtooth";
            bootOsc.frequency.setValueAtTime(90, audioContext.currentTime);
            bootOsc.frequency.exponentialRampToValueAtTime(42, audioContext.currentTime + 0.8);
            bootGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
            bootGain.gain.exponentialRampToValueAtTime(0.035, audioContext.currentTime + 0.12);
            bootGain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.9);
            bootOsc.connect(bootGain);
            bootGain.connect(masterGain);
            bootOsc.start();
            bootOsc.stop(audioContext.currentTime + 0.95);
        }

        /* ================================
           ЗАГРУЗКА ПК
           ================================ */

        async function boot() {

            print("AKWA BIOS v4.28", "system");

            await sleep(500);

            print("--------------------------------", "system");

            await sleep(400);

            print("MEMORY CHECK ............ OK");

            await sleep(250);

            print("CPU CHECK ............... OK");

            await sleep(250);

            print("STORAGE CHECK ........... OK");

            await sleep(500);

            print("");

            print("NODE 17");

            await sleep(250);

            print("BOOT DEVICE ............. LOCAL");

            await sleep(700);

            print("");

            print("LOADING AKWA OS...", "success");

            await sleep(1000);

            print("");

            print(
                "[СИСТЕМА]: Запуск операционной системы...",
                "system"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Проверка локального оборудования...",
                "system"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Проверка сетевого модуля...",
                "system"
            );

            await sleep(700);

            print(
                "[СИСТЕМА]: Поиск AKWA-INTERNAL...",
                "system"
            );

            await sleep(1000);

            print(
                "[СИСТЕМА]: СЕТЬ НАЙДЕНА.",
                "success"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Подключение к REMOTE NODE 17...",
                "system"
            );

            await sleep(1200);

            print(
                "[СИСТЕМА]: СОЕДИНЕНИЕ УСТАНОВЛЕНО.",
                "success"
            );

            await sleep(500);

            print("");

            print("AKWA // REMOTE NODE 17");

            print("--------------------------------");

            print("SYSTEM STATUS ........ ONLINE");

            print("NETWORK .............. AKWA-INTERNAL");

            print("NODE ................. 17");

            print("SECURITY LEVEL ....... 03");

            await sleep(500);

            print("");

            print(
                "Последний зарегистрированный пользователь:"
            );

            print("Adrian_lamo", "system");

            await sleep(500);

            print("");

            print(
                "Введите команду help для получения списка доступных команд."
            );

            await sleep(300);

            inputLine.style.display = "flex";

            input.focus();
        }


        /* ================================
           КНОПКА
           ================================ */

        button.addEventListener("click", function() {

            initAudio();
            powerOnSound();

            startup.style.display = "none";

            terminal.style.display = "flex";

            boot();

        });


        /* ================================
   КОМАНДЫ
   ================================ */

const API_URL = "https://akwa-terminal-api.moskinasasa32.workers.dev";

        let mode = "command";
        let authUsername = "";
        let loggedInUser = "";
        let sessionToken = "";
        let loggedInAccessLevel = 0;

        input.addEventListener("keydown", async function(event) {
            if (event.key.length === 1 || event.key === "Enter" || event.key === "Backspace") keySound();
            if (event.key !== "Enter") return;

            const value = input.value.trim();
            if (value === "") return;

            input.value = "";

            if (mode === "register_username") {
                authUsername = value.toLowerCase();
                print("USER ID: " + authUsername);
                print("Введите пароль:");
                mode = "register_password";
                return;
            }

            if (mode === "register_password") {
                const password = value;
                print("PASSWORD: ********");

                try {
                    const response = await fetch(API_URL + "/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: authUsername,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.ok) {
                        print("");
                        print(data.message, "success");
                    } else {
                        print(data.error || "REGISTRATION FAILED", "error");
                    }
                } catch (error) {
                    print("ERROR: CONNECTION FAILED", "error");
                }

                authUsername = "";
                mode = "command";
                return;
            }

            if (mode === "login_username") {
                authUsername = value.toLowerCase();
                print("USER ID: " + authUsername);
                print("Введите пароль:");
                mode = "login_password";
                return;
            }

            if (mode === "login_password") {
                const password = value;
                print("PASSWORD: ********");

                try {
                    const response = await fetch(API_URL + "/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: authUsername,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.ok) {
                        loggedInUser = data.username;
                        loggedInAccessLevel = Number(data.access_level) || 0;
                        sessionToken = data.session_token || "";

                        print("");
                        print("AUTHENTICATION SUCCESSFUL", "success");
                        print("USER ID ........ " + data.username);
                        print("STATUS ......... " + data.status);
                        print("ACCESS LEVEL ... " + data.access_level);
                    } else {
                        print(data.error || "AUTHENTICATION FAILED", "error");
                        authUsername = "";
                    }
                } catch (error) {
                    print("ERROR: CONNECTION FAILED", "error");
                    authUsername = "";
                }

                mode = "command";
                return;
            }

            const command = value.toLowerCase();

            print("AKWA_OS: " + value, "command");

            if (command === "help") {
                print("");
                print("AVAILABLE COMMANDS");
                print("");
                print("help");
                print("status");
                print("login");
                print("register");
                print("personnel");
                print("logout");
                print("clear");
            }

            else if (command === "status") {
                print("");
                print("SYSTEM STATUS ........ ONLINE");
                print("NETWORK .............. AKWA-INTERNAL");
                print("NODE ................. 17");
                print("SECURITY LEVEL ....... 03");

                if (loggedInUser) {
                    print("");
                    print("AUTHENTICATED USER ... " + loggedInUser);
                    print("ACCESS LEVEL ......... " + loggedInAccessLevel);
                }
            }

            else if (command === "register") {
                print("");
                print("REGISTRATION");
                print("");
                print("USER ID:");
                mode = "register_username";
            }

            else if (command === "login") {
                print("");
                print("AUTHENTICATION");
                print("");
                print("USER ID:");
                mode = "login_username";
            }

            else if (command === "personnel") {
                if (!sessionToken) {
                    print("");
                    print("AUTHENTICATION REQUIRED", "error");
                    return;
                }

                print("");
                print("ACCESSING PERSONNEL DATABASE...");
                print("");

                try {
                    const response = await fetch(API_URL + "/personnel", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + sessionToken
                        }
                    });

                    const data = await response.json();

                    if (data.ok) {
                        print("ACCESS GRANTED", "success");
                        print("");

                        if (Array.isArray(data.data)) {
                            data.data.forEach(line => print(line));
                        }
                    } else {
                        print(data.error || "ACCESS DENIED", "error");
                    }
                } catch (error) {
                    print("ERROR: CONNECTION FAILED", "error");
                }
            }

            else if (command === "logout") {
                if (!sessionToken) {
                    print("NO ACTIVE SESSION", "warning");
                    return;
                }

                try {
                    const response = await fetch(API_URL + "/logout", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + sessionToken
                        }
                    });

                    const data = await response.json();

                    if (data.ok) {
                        sessionToken = "";
                        loggedInUser = "";
                        loggedInAccessLevel = null;
                        print(data.message, "success");
                    } else {
                        print(data.error || "LOGOUT FAILED", "error");
                    }
                } catch (error) {
                    print("ERROR: CONNECTION FAILED", "error");
                }
            }

            else if (command === "clear") {
                output.innerHTML = "";
            }

            else {
                print("ERROR: UNKNOWN COMMAND", "error");
            }
        });

    </script>

</body>
</html>
