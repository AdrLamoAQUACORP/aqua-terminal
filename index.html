    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKWA // REMOTE NODE 17</title>

    <style>

        body {

   <style>

    body {
        margin: 0;
        background-color: #050505;
        color: #00ff66;

        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        line-height: 1.5;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;
    }


    #terminal {
        width: 90%;
        max-width: 900px;

        min-height: 500px;

        border: 1px solid #00ff66;

        padding: 30px;

        box-sizing: border-box;

        box-shadow:
            0 0 15px rgba(0, 255, 102, 0.2);
    }


    #output {
        text-align: center;
    }


    .input-line {
        display: flex;

        justify-content: center;
        align-items: center;

        margin-top: 20px;
    }


    .prompt {
        color: #00aaff;

        margin-right: 10px;

        white-space: nowrap;
    }


    input {
        background: transparent;

        border: none;
        outline: none;

        color: #00ff66;

        font-family: inherit;
        font-size: inherit;

        width: 300px;

        text-align: center;
    }


    .error {
        color: #ff3333;
    }


    .success {
        color: #ffff33;
    }


    .system {
        color: #aaaaaa;
    }


    .warning {
        color: #ffaa00;
    }

</style>


<script>


    // =========================================================
    // ОСНОВНЫЕ ЭЛЕМЕНТЫ ТЕРМИНАЛА
    // =========================================================

    const output = document.getElementById("output");

    const input = document.getElementById("cmd-input");

    const promptText = document.getElementById("prompt-text");


    // =========================================================
    // СОСТОЯНИЕ ТЕРМИНАЛА
    // =========================================================

    let currentStep = "COMMAND";

    let registrationData = {
        login: "",
        password: ""
    };


    // =========================================================
    // ВЫВОД ТЕКСТА
    // =========================================================

    function print(text = "", className = "") {

        const div = document.createElement("div");

        div.className = className;

        div.innerHTML = text;

        output.appendChild(div);

        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }


    // =========================================================
    // HELP
    // =========================================================

    function showHelp() {

        print("AVAILABLE COMMANDS");

        print("");

        print("help");

        print("status");

        print("login");

        print("register");

        print("clear");

    }


    // =========================================================
    // STATUS
    // =========================================================

    function showStatus() {

        print("SYSTEM STATUS ........ ONLINE");

        print("NETWORK .............. AKWA-INTERNAL");

        print("NODE ................. 17");

        print("SECURITY LEVEL ....... 03");

        print("");

        print("LAST USER ............ ADRIAN LAMO");

        print("ACCOUNT STATUS ....... ACTIVE");

    }


    // =========================================================
    // ОЧИСТКА
    // =========================================================

    function clearTerminal() {

        output.innerHTML = "";

    }


    // =========================================================
    // LOGIN
    // =========================================================

    function startLogin() {

        print("AUTHENTICATION REQUIRED", "system");

        print("");

        print("USER ID:");

        promptText.innerText = "USER ID:";

        currentStep = "LOGIN";

    }


    // =========================================================
    // РЕГИСТРАЦИЯ
    // =========================================================

    function startRegistration() {

        print("ACCOUNT REGISTRATION", "system");

        print("");

        print("Новая учётная запись не получает доступ к закрытым разделам.");

        print("После регистрации данные будут отправлены руководству на рассмотрение.");

        print("");

        print("Введите желаемый USER ID:");

        promptText.innerText = "NEW USER ID:";

        currentStep = "REGISTER_LOGIN";

    }


    // =========================================================
    // ОБРАБОТКА КОМАНД
    // =========================================================

    function handleCommand(value) {

        const lowerValue = value.trim().toLowerCase();


        // -----------------------------------------------------
        // ОБЫЧНЫЕ КОМАНДЫ
        // -----------------------------------------------------

        if (currentStep === "COMMAND") {

            switch (lowerValue) {

                case "help":

                    showHelp();

                    break;


                case "status":

                    showStatus();

                    break;


                case "login":

                    startLogin();

                    break;


                case "register":

                    startRegistration();

                    break;


                case "clear":

                    clearTerminal();

                    break;


                case "":

                    break;


                default:

                    print(
                        "ERROR: UNKNOWN COMMAND",
                        "error"
                    );

            }

            return;

        }


        // -----------------------------------------------------
        // LOGIN
        // -----------------------------------------------------

        if (currentStep === "LOGIN") {

            if (lowerValue === "adrian_lamo") {

                print(
                    "[СИСТЕМА]: USER ID ACCEPTED.",
                    "success"
                );

                print("");

                print(
                    "Введите пароль:"
                );

                promptText.innerText = "PASSWORD:";

                currentStep = "PASSWORD";

            }

            else {

                print(
                    "ERROR: USER NOT FOUND.",
                    "error"
                );

                print(
                    "Если у вас нет учётной записи, используйте команду register."
                );

                promptText.innerText = "AKWA_OS:";

                currentStep = "COMMAND";

            }

            return;

        }


        // -----------------------------------------------------
        // ПАРОЛЬ
        // -----------------------------------------------------

        if (currentStep === "PASSWORD") {

            /*
                ВАЖНО:

                Настоящий пароль здесь пока НЕ создаём.

                Эта часть будет подключена к серверной
                системе авторизации.

                Сейчас мы только создаём правильную
                структуру терминала.
            */

            print(
                "AUTHENTICATION SERVICE UNAVAILABLE.",
                "error"
            );

            print("");

            print(
                "REMOTE AUTHENTICATION MODULE REQUIRED.",
                "system"
            );

            print("");

            promptText.innerText = "AKWA_OS:";

            currentStep = "COMMAND";

            return;

        }


        // -----------------------------------------------------
        // РЕГИСТРАЦИЯ — USER ID
        // -----------------------------------------------------

        if (currentStep === "REGISTER_LOGIN") {

            if (value.trim().length < 3) {

                print(
                    "ERROR: USER ID TOO SHORT.",
                    "error"
                );

                return;

            }


            registrationData.login = value.trim();


            print(
                "USER ID ACCEPTED.",
                "success"
            );

            print("");

            print(
                "Введите пароль:"
            );

            promptText.innerText = "NEW PASSWORD:";

            currentStep = "REGISTER_PASSWORD";

            return;

        }


        // -----------------------------------------------------
        // РЕГИСТРАЦИЯ — ПАРОЛЬ
        // -----------------------------------------------------

        if (currentStep === "REGISTER_PASSWORD") {

            if (value.length < 4) {

                print(
                    "ERROR: PASSWORD TOO SHORT.",
                    "error"
                );

                return;

            }


            registrationData.password = value;


            print(
                "Регистрация завершена.",
                "success"
            );

            print("");

            print(
                "Ваши данные были отправлены для ознакомления и подтверждения руководству.",
                "system"
            );

            print("");

            print(
                "ACCOUNT STATUS: PENDING"
            );

            print(
                "ACCESS LEVEL: NONE"
            );

            print("");

            print(
                "Доступ к закрытым разделам отсутствует.",
                "warning"
            );


            registrationData = {
                login: "",
                password: ""
            };


            promptText.innerText = "AKWA_OS:";

            currentStep = "COMMAND";

            return;

        }

    }


    // =========================================================
    // НАЖАТИЕ ENTER
    // =========================================================

    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key !== "Enter") {
                return;
            }


            const value = input.value;


            if (!value.trim()) {
                return;
            }


            print(
                `${promptText.innerText} ${value}`
            );


            input.value = "";


            handleCommand(value);

        }
    );


</script>


</body>

</html>
