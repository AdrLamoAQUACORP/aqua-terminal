<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKWA // REMOTE NODE 17</title>

    <style>

        body {
            margin: 0;

            background: #050505;
            color: #00ff66;

            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            line-height: 1.5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        /* =========================================
           ЭКРАН ЗАПУСКА
           ========================================= */

        #startup {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }


        #startup-title {
            font-size: 24px;
            letter-spacing: 3px;
        }


        #startup-subtitle {
            color: #777;
            font-size: 14px;
        }


        #start-button {
            background: transparent;

            border: 1px solid #00ff66;

            color: #00ff66;

            font-family: "Courier New", Courier, monospace;
            font-size: 16px;

            padding: 14px 35px;

            cursor: pointer;

            transition: 0.2s;
        }


        #start-button:hover {
            background: #00ff66;
            color: #050505;

            box-shadow:
                0 0 15px rgba(0, 255, 102, 0.4);
        }


        /* =========================================
           ТЕРМИНАЛ
           ========================================= */

        #terminal {
            width: 90%;
            max-width: 900px;

            min-height: 500px;

            border: 1px solid #00ff66;

            padding: 30px;

            box-sizing: border-box;

            box-shadow:
                0 0 15px rgba(0, 255, 102, 0.2);

            display: none;
        }


        #output {
            text-align: center;
        }


        .input-line {
            display: flex;

            justify-content: center;
            align-items: center;

            margin-top: 20px;
        }


        .prompt {
            color: #00aaff;

            margin-right: 10px;

            white-space: nowrap;
        }


        input {
            background: transparent;

            border: none;
            outline: none;

            color: #00ff66;

            font-family: inherit;
            font-size: inherit;

            width: 300px;

            text-align: center;
        }


        .error {
            color: #ff3333;
        }


        .success {
            color: #ffff33;
        }


        .system {
            color: #aaaaaa;
        }


        .warning {
            color: #ffaa00;
        }


        .cursor {
            animation: blink 1s infinite;
        }


        @keyframes blink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     ЭКРАН ДО ЗАПУСКА
     ========================================= -->

<div id="startup">

    <div id="startup-title">
        AKWA // REMOTE NODE 17
    </div>

    <div id="startup-subtitle">
        REMOTE COMPUTER TERMINAL
    </div>

    <button id="start-button">
        ЗАПУСТИТЬ ПК
    </button>

</div>



<!-- =========================================
     ТЕРМИНАЛ
     ========================================= -->

<div id="terminal">

    <div id="output"></div>

    <div
        class="input-line"
        id="input-line"
    >

        <span
            id="prompt-text"
            class="prompt"
        >
            AKWA_OS:
        </span>

        <input
            type="text"
            id="cmd-input"
            autofocus
            autocomplete="off"
        >

    </div>

</div>



<script>


    /* =========================================
       ЭЛЕМЕНТЫ
       ========================================= */

    const startup =
        document.getElementById("startup");

    const startButton =
        document.getElementById("start-button");

    const terminal =
        document.getElementById("terminal");

    const output =
        document.getElementById("output");

    const input =
        document.getElementById("cmd-input");

    const inputLine =
        document.getElementById("input-line");

    const promptText =
        document.getElementById("prompt-text");



    /* =========================================
       СОСТОЯНИЕ
       ========================================= */

    let systemReady = false;



    /* =========================================
       ВЫВОД СТРОКИ
       ========================================= */

    function print(text = "", className = "") {

        const div =
            document.createElement("div");

        div.className = className;

        div.innerHTML = text;

        output.appendChild(div);

        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }



    /* =========================================
       ЗАДЕРЖКА
       ========================================= */

    function wait(ms) {

        return new Promise(
            resolve => setTimeout(resolve, ms)
        );

    }



    /* =========================================
       АНИМАЦИЯ ПЕЧАТИ
       ========================================= */

    async function typeLine(
        text,
        className = "",
        speed = 25
    ) {

        const div =
            document.createElement("div");

        div.className = className;

        output.appendChild(div);


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            div.textContent =
                text.substring(0, i + 1);

            await wait(speed);

        }


        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }



    /* =========================================
       ЗАГРУЗКА ПК
       ========================================= */

    async function bootComputer() {

        inputLine.style.display = "none";


        await typeLine(
            "AKWA BIOS v4.28",
            "system",
            20
        );


        await typeLine(
            "--------------------------------",
            "system",
            10
        );


        await wait(300);


        await typeLine(
            "MEMORY CHECK ............ OK"
        );


        await wait(180);


        await typeLine(
            "CPU CHECK ............... OK"
        );


        await wait(180);


        await typeLine(
            "STORAGE CHECK ........... OK"
        );


        await wait(300);


        await typeLine(
            "NODE 17"
        );


        await typeLine(
            "BOOT DEVICE ............. LOCAL"
        );


        await wait(500);


        print("");


        await typeLine(
            "LOADING AKWA OS...",
            "success",
            40
        );


        await wait(700);


        print("");


        await typeLine(
            "[СИСТЕМА]: Запуск операционной системы...",
            "system",
            20
        );


        await wait(400);


        await typeLine(
            "[СИСТЕМА]: Проверка локального оборудования...",
            "system",
            20
        );


        await wait(400);


        await typeLine(
            "[СИСТЕМА]: Проверка сетевого модуля...",
            "system",
            20
        );


        await wait(600);


        await typeLine(
            "[СИСТЕМА]: Поиск AKWA-INTERNAL...",
            "system",
            20
        );


        await wait(800);


        await typeLine(
            "[СИСТЕМА]: СЕТЬ НАЙДЕНА.",
            "success",
            25
        );


        await wait(300);


        await typeLine(
            "[СИСТЕМА]: Подключение к REMOTE NODE 17...",
            "system",
            20
        );


        await wait(900);


        await typeLine(
            "[СИСТЕМА]: СОЕДИНЕНИЕ УСТАНОВЛЕНО.",
            "success",
            25
        );


        await wait(500);


        print("");


        await typeLine(
            "AKWA // REMOTE NODE 17",
            "",
            30
        );


        await typeLine(
            "--------------------------------",
            "",
            10
        );


        await typeLine(
            "SYSTEM STATUS ........ ONLINE"
        );


        await typeLine(
            "NETWORK .............. AKWA-INTERNAL"
        );


        await typeLine(
            "NODE ................. 17"
        );


        await typeLine(
            "SECURITY LEVEL ....... 03"
        );


        await wait(500);


        print("");


        await typeLine(
            "Последний зарегистрированный пользователь:"
        );


        await typeLine(
            "ADRIAN LAMO",
            "success",
            35
        );


        await wait(500);


        print("");


        await typeLine(
            "Введите команду help для получения списка доступных команд."
        );


        await wait(300);


        inputLine.style.display = "flex";

        input.focus();

        systemReady = true;

    }



    /* =========================================
       КНОПКА ЗАПУСКА
       ========================================= */

    startButton.addEventListener(
        "click",
        async function() {

            startButton.disabled = true;

            startup.style.display = "none";

            terminal.style.display = "block";

            await bootComputer();

        }
    );



    /* =========================================
       HELP
       ========================================= */

    function showHelp() {

        print("AVAILABLE COMMANDS");

        print("");

        print("help");

        print("status");

        print("login");

        print("register");

        print("clear");

    }



    /* =========================================
       STATUS
       ========================================= */

    function showStatus() {

        print(
            "SYSTEM STATUS ........ ONLINE"
        );

        print(
            "NETWORK .............. AKWA-INTERNAL"
        );

        print(
            "NODE ................. 17"
        );

        print(
            "SECURITY LEVEL ....... 03"
        );

        print("");

        print(
            "LAST USER ............ ADRIAN LAMO"
        );

        print(
            "ACCOUNT STATUS ....... ACTIVE"
        );

    }



    /* =========================================
       CLEAR
       ========================================= */

    function clearTerminal() {

        output.innerHTML = "";

    }



    /* =========================================
       LOGIN
       ========================================= */

    function startLogin() {

        print(
            "AUTHENTICATION REQUIRED",
            "system"
        );

        print("");

        print(
            "USER ID:"
        );

        promptText.innerText =
            "USER ID:";

    }



    /* =========================================
       REGИСТРАЦИЯ
       ========================================= */

    function startRegistration() {

        print(
            "ACCOUNT REGISTRATION",
            "system"
        );

        print("");

        print(
            "Введите желаемый USER ID:"
        );

        promptText.innerText =
            "NEW USER ID:";

    }



    /* =========================================
       ОБРАБОТКА КОМАНД
       ========================================= */

    function handleCommand(value) {

        const command =
            value.trim().toLowerCase();


        print(
            `${promptText.innerText} ${value}`
        );

        print("");


        switch (command) {


            case "help":

                showHelp();

                break;


            case "status":

                showStatus();

                break;


            case "clear":

                clearTerminal();

                break;


            case "login":

                startLogin();

                break;


            case "register":

                startRegistration();

                break;


            case "":

                break;


            default:

                print(
                    "ERROR: UNKNOWN COMMAND",
                    "error"
                );

        }

    }



    /* =========================================
       ENTER
       ========================================= */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
                || !systemReady
            ) {

                return;

            }


            const value =
                input.value;


            if (!value.trim()) {

                return;

            }


            input.value = "";


            handleCommand(value);

        }
    );


</script>


</body>

</html>
