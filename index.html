<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKWA // REMOTE NODE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #050505;
            color: #00ff66;

            font-family: "Courier New", monospace;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* ================================
           ЭКРАН ЗАПУСКА
           ================================ */

        #startup {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 20px;

            width: 100%;
        }

        #startup-title {
            font-size: 28px;
            letter-spacing: 4px;
        }

        #startup-subtitle {
            color: #777;
            font-size: 14px;
            letter-spacing: 2px;
        }

        #start-button {
            margin-top: 20px;

            padding: 15px 40px;

            background: transparent;

            border: 1px solid #00ff66;

            color: #00ff66;

            font-family: "Courier New", monospace;
            font-size: 16px;

            cursor: pointer;
        }

        #start-button:hover {
            background: #00ff66;
            color: #050505;
        }

        /* ================================
           ТЕРМИНАЛ
           ================================ */

        #terminal {
            display: none;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90vw;
            max-width: 900px;
            height: 70vh;
            min-height: 400px;

            padding: 30px;

            border: 1px solid #00ff66;

            box-shadow:
                0 0 20px rgba(0, 255, 102, 0.2);

            flex-direction: column;
            overflow: hidden;
        }

        #output {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            text-align: center;

            padding-bottom: 15px;
        }

        .system {
            color: #999;
        }

        .success {
            color: #ffff33;
        }

        .error {
            color: #ff3333;
        }

        .warning {
            color: #ffaa00;
        }

        #input-line {
            display: none;

            flex-shrink: 0;

            justify-content: center;
            align-items: center;

            width: 100%;

            margin-top: 15px;
            padding-top: 15px;

            border-top: 1px solid rgba(0, 255, 102, 0.25);

            background: #050505;
        }

        #prompt {
            color: #00aaff;
            margin-right: 10px;
        }

        #command-input {
            width: 300px;

            background: transparent;

            border: none;
            outline: none;

            color: #00ff66;

            font-family: "Courier New", monospace;
            font-size: 16px;

            text-align: center;
        }
    </style>
</head>


<body>

    <!-- =================================
         ЭКРАН ДО ЗАПУСКА
         ================================= -->

    <div id="startup">

        <div id="startup-title">
            AKWA // REMOTE NODE 17
        </div>

        <div id="startup-subtitle">
            REMOTE COMPUTER TERMINAL
        </div>

        <button id="start-button">
            ЗАПУСТИТЬ ПК
        </button>

    </div>


    <!-- =================================
         ТЕРМИНАЛ
         ================================= -->

    <div id="terminal">

        <div id="output"></div>

        <div id="input-line">

            <span id="prompt">
                AKWA_OS:
            </span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
            >

        </div>

    </div>


    <script>

        const startup = document.getElementById("startup");
        const terminal = document.getElementById("terminal");
        const button = document.getElementById("start-button");

        const output = document.getElementById("output");
        const inputLine = document.getElementById("input-line");
        const input = document.getElementById("command-input");


        /* ================================
           ВЫВОД ТЕКСТА
           ================================ */

        function print(text, className = "") {

            const line = document.createElement("div");

            line.className = className;

            line.textContent = text;

            output.appendChild(line);

            output.scrollTop = output.scrollHeight;
        }


        /* ================================
           ПАУЗА
           ================================ */

        function sleep(ms) {
            return new Promise(resolve => {
                setTimeout(resolve, ms);
            });
        }


        /* ================================
           ЗАГРУЗКА ПК
           ================================ */

        async function boot() {

            print("AKWA BIOS v4.28", "system");

            await sleep(500);

            print("--------------------------------", "system");

            await sleep(400);

            print("MEMORY CHECK ............ OK");

            await sleep(250);

            print("CPU CHECK ............... OK");

            await sleep(250);

            print("STORAGE CHECK ........... OK");

            await sleep(500);

            print("");

            print("NODE 17");

            await sleep(250);

            print("BOOT DEVICE ............. LOCAL");

            await sleep(700);

            print("");

            print("LOADING AKWA OS...", "success");

            await sleep(1000);

            print("");

            print(
                "[СИСТЕМА]: Запуск операционной системы...",
                "system"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Проверка локального оборудования...",
                "system"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Проверка сетевого модуля...",
                "system"
            );

            await sleep(700);

            print(
                "[СИСТЕМА]: Поиск AKWA-INTERNAL...",
                "system"
            );

            await sleep(1000);

            print(
                "[СИСТЕМА]: СЕТЬ НАЙДЕНА.",
                "success"
            );

            await sleep(500);

            print(
                "[СИСТЕМА]: Подключение к REMOTE NODE 17...",
                "system"
            );

            await sleep(1200);

            print(
                "[СИСТЕМА]: СОЕДИНЕНИЕ УСТАНОВЛЕНО.",
                "success"
            );

            await sleep(500);

            print("");

            print("AKWA // REMOTE NODE 17");

            print("--------------------------------");

            print("SYSTEM STATUS ........ ONLINE");

            print("NETWORK .............. AKWA-INTERNAL");

            print("NODE ................. 17");

            print("SECURITY LEVEL ....... 03");

            await sleep(500);

            print("");

            print(
                "Последний зарегистрированный пользователь:"
            );

            print("ADRIAN LAMO", "success");

            await sleep(500);

            print("");

            print(
                "Введите команду help для получения списка доступных команд."
            );

            await sleep(300);

            inputLine.style.display = "flex";

            input.focus();
        }


        /* ================================
           КНОПКА
           ================================ */

        button.addEventListener("click", function() {

            startup.style.display = "none";

            terminal.style.display = "flex";

            boot();

        });


        /* ================================
   КОМАНДЫ
   ================================ */

const API_URL = "https://akwa-terminal-api.moskinasasa32.workers.dev";

let mode = "command";
let authUsername = "";

input.addEventListener("keydown", async function(event) {
    if (event.key !== "Enter") return;

    const value = input.value.trim();
    if (value === "") return;

    input.value = "";

    if (mode === "register_username") {
        authUsername = value.toLowerCase();
        print("USER ID: " + authUsername);
        print("Введите пароль:");
        mode = "register_password";
        return;
    }

    if (mode === "register_password") {
        const password = value;
        print("PASSWORD: ********");

        try {
            const response = await fetch(API_URL + "/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: authUsername,
                    password: password
                })
            });

            const data = await response.json();

            if (data.ok) {
                print("");
                print(data.message, "success");
            } else {
                print(data.error || "REGISTRATION FAILED", "error");
            }
        } catch (error) {
            print("ERROR: CONNECTION FAILED", "error");
        }

        authUsername = "";
        mode = "command";
        return;
    }

    if (mode === "login_username") {
        authUsername = value.toLowerCase();
        print("USER ID: " + authUsername);
        print("Введите пароль:");
        mode = "login_password";
        return;
    }

    if (mode === "login_password") {
        const password = value;
        print("PASSWORD: ********");

        try {
            const response = await fetch(API_URL + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: authUsername,
                    password: password
                })
            });

            const data = await response.json();

            if (data.ok) {
                print("");
                print("AUTHENTICATION SUCCESSFUL", "success");
                print("USER ID ........ " + data.username);
                print("STATUS ......... " + data.status);
                print("ACCESS LEVEL ... " + data.access_level);
            } else {
                print(data.error || "AUTHENTICATION FAILED", "error");
            }
        } catch (error) {
            print("ERROR: CONNECTION FAILED", "error");
        }

        authUsername = "";
        mode = "command";
        return;
    }

    const command = value.toLowerCase();

    print("AKWA_OS: " + value);

    if (command === "help") {
        print("");
        print("AVAILABLE COMMANDS");
        print("");
        print("help");
        print("status");
        print("login");
        print("register");
        print("clear");
    }
    else if (command === "status") {
        print("");
        print("SYSTEM STATUS ........ ONLINE");
        print("NETWORK .............. AKWA-INTERNAL");
        print("NODE ................. 17");
        print("SECURITY LEVEL ....... 03");
    }
    else if (command === "register") {
        print("");
        print("REGISTRATION");
        print("");
        print("USER ID:");
        mode = "register_username";
    }
    else if (command === "login") {
        print("");
        print("AUTHENTICATION");
        print("");
        print("USER ID:");
        mode = "login_username";
    }
    else if (command === "clear") {
        output.innerHTML = "";
    }
    else {
        print("ERROR: UNKNOWN COMMAND", "error");
    }
});

    </script>

</body>
</html>
